name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true 

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libmpfr-dev libgmp-dev

      - name: Configure (CMake, Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMATX_BUILD_TESTS=ON -DCMAKE_INSTALL_INCLUDEDIR=include

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run gtest
        run: ./build/tests/matx_tests
